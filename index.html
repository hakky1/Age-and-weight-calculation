<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر والوزن المثالي | Age & Weight Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: #2a5298;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-btn:hover {
            background: #1e3c72;
            transform: translateY(-1px);
        }

        h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #2a5298;
        }

        .calc-btn {
            width: 100%;
            padding: 14px;
            background: #2a5298;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .calc-btn:hover {
            background: #1e3c72;
        }

        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e0e0e0;
            display: none;
        }

        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-inline-start: 4px solid #2a5298;
        }

        .result-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 17px;
            font-weight: bold;
            color: #111;
        }

        .target-box {
            background: #eef9f1;
            border-inline-start-color: #2e7d32;
        }

        .status-message {
            font-size: 15px;
            line-height: 1.5;
            font-weight: 600;
        }

        .footer-links {
            margin-top: 25px;
            text-align: center;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 14px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .footer-links a {
            color: #2a5298;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #1e3c72;
            text-decoration: underline;
        }

        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #e1306c !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="top-bar">
            <span>🌐</span>
            <button class="lang-btn" onclick="toggleLanguage()" id="langToggleBtn">English ➔</button>
        </div>

        <h2 id="txtTitle">حاسبة العمر والوزن المثالي</h2>

        <div class="input-group">
            <label for="birthdate" id="lblBirthdate">تاريخ الميلاد الكامل:</label>
            <input type="date" id="birthdate">
        </div>

        <div class="input-group">
            <label for="height" id="lblHeight">الطول (بالسنتيمتر):</label>
            <input type="number" id="height" placeholder="175" min="50" max="250">
        </div>

        <div class="input-group">
            <label for="weight" id="lblWeight">الوزن الحالي (بالكيلوغرام):</label>
            <input type="number" id="weight" placeholder="80" step="0.1" min="20" max="300">
        </div>

        <button class="calc-btn" onclick="calculate()" id="btnCalculate">احسب النتائج</button>

        <div class="results" id="resultsBlock">
            <div class="result-box">
                <div class="result-title" id="lblAgeResult">العمر الحالي:</div>
                <div class="result-value" id="ageOutput">--</div>
            </div>

            <div class="result-box">
                <div class="result-title" id="lblIdealResult">الوزن المثالي المقترح:</div>
                <div class="result-value" id="idealWeightOutput">--</div>
            </div>

            <div class="result-box target-box">
                <div class="result-title" id="lblTargetResult">الهدف للوصول للوزن المثالي:</div>
                <div class="status-message" id="targetAdvice">--</div>
            </div>
        </div>

        <div class="footer-links">
            <a href="https://www.instagram.com/hki_184/" target="_blank" class="insta-btn">
                📸 <span id="lblDeveloper">المطور</span>
            </a>
            <a href="privacy.html" target="_blank" id="lblPrivacy">سياسة الخصوصية</a>
        </div>
    </div>

    <script>
        let currentLang = 'ar';

        const i18n = {
            ar: {
                langBtn: "English ➔",
                dir: "rtl",
                title: "حاسبة العمر والوزن المثالي",
                lblBirthdate: "تاريخ الميلاد الكامل:",
                lblHeight: "الطول (بالسنتيمتر):",
                lblWeight: "الوزن الحالي (بالكيلوغرام):",
                btnCalculate: "احسب النتائج",
                lblAgeResult: "العمر الحالي:",
                lblIdealResult: "الوزن المثالي المقترح:",
                lblTargetResult: "الهدف للوصول للوزن المثالي:",
                lblDeveloper: "المطور",
                lblPrivacy: "سياسة الخصوصية",
                alertFill: "يرجى إدخال جميع البيانات بشكل صحيح!",
                years: "سنة",
                months: "شهر",
                days: "يوم",
                kg: "كغم",
                range: "النطاق الصحي",
                loseMsg: (diff) => `تحتاج إلى إنقاص حوالي ${diff} كغم للوصول إلى الوزن المثالي.`,
                gainMsg: (diff) => `تحتاج إلى زيادة حوالي ${diff} كغم للوصول إلى الوزن المثالي.`,
                perfectMsg: "ممتاز! وزنك الحالي يقع ضمن نطاق الوزن المثالي والصحي."
            },
            en: {
                langBtn: "العربية ➔",
                dir: "ltr",
                title: "Age & Ideal Weight Calculator",
                lblBirthdate: "Full Date of Birth:",
                lblHeight: "Height (in cm):",
                lblWeight: "Current Weight (in kg):",
                btnCalculate: "Calculate Results",
                lblAgeResult: "Current Age:",
                lblIdealResult: "Suggested Ideal Weight:",
                lblTargetResult: "Goal to Reach Ideal Weight:",
                lblDeveloper: "Developer",
                lblPrivacy: "Privacy Policy",
                alertFill: "Please fill in all fields correctly!",
                years: "years",
                months: "months",
                days: "days",
                kg: "kg",
                range: "Healthy Range",
                loseMsg: (diff) => `You need to lose about ${diff} kg to reach your ideal weight.`,
                gainMsg: (diff) => `You need to gain about ${diff} kg to reach your ideal weight.`,
                perfectMsg: "Great! Your current weight is within the ideal and healthy range."
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const langData = i18n[currentLang];

            document.documentElement.lang = currentLang;
            document.documentElement.dir = langData.dir;

            document.getElementById('langToggleBtn').innerText = langData.langBtn;
            document.getElementById('txtTitle').innerText = langData.title;
            document.getElementById('lblBirthdate').innerText = langData.lblBirthdate;
            document.getElementById('lblHeight').innerText = langData.lblHeight;
            document.getElementById('lblWeight').innerText = langData.lblWeight;
            document.getElementById('btnCalculate').innerText = langData.btnCalculate;
            document.getElementById('lblAgeResult').innerText = langData.lblAgeResult;
            document.getElementById('lblIdealResult').innerText = langData.lblIdealResult;
            document.getElementById('lblTargetResult').innerText = langData.lblTargetResult;
            document.getElementById('lblDeveloper').innerText = langData.lblDeveloper;
            document.getElementById('lblPrivacy').innerText = langData.lblPrivacy;

            if (document.getElementById('resultsBlock').style.display === 'block') {
                calculate();
            }
        }

        function calculate() {
            const birthdateInput = document.getElementById('birthdate').value;
            const heightInput = parseFloat(document.getElementById('height').value);
            const weightInput = parseFloat(document.getElementById('weight').value);
            const langData = i18n[currentLang];

            if (!birthdateInput || !heightInput || !weightInput) {
                alert(langData.alertFill);
                return;
            }

            // 1. حساب العمر بالأرقام الإنجليزية
            const birthDate = new Date(birthdateInput);
            const today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('ageOutput').innerText = 
                `${years} ${langData.years}, ${months} ${langData.months}, ${days} ${langData.days}`;

            // 2. حساب الوزن المثالي بالأرقام الإنجليزية
            const heightInMeters = heightInput / 100;
            const idealWeight = (22 * (heightInMeters * heightInMeters)).toFixed(1);
            const minIdeal = (18.5 * (heightInMeters * heightInMeters)).toFixed(1);
            const maxIdeal = (24.9 * (heightInMeters * heightInMeters)).toFixed(1);

            document.getElementById('idealWeightOutput').innerText = 
                `${idealWeight} ${langData.kg} (${langData.range}: ${minIdeal} - ${maxIdeal} ${langData.kg})`;

            // 3. النصيحة والهدف
            const adviceElement = document.getElementById('targetAdvice');

            if (weightInput > maxIdeal) {
                const lossNeeded = (weightInput - idealWeight).toFixed(1);
                adviceElement.style.color = "#d32f2f";
                adviceElement.innerText = langData.loseMsg(lossNeeded);
            } else if (weightInput < minIdeal) {
                const gainNeeded = (idealWeight - weightInput).toFixed(1);
                adviceElement.style.color = "#e65100";
                adviceElement.innerText = langData.gainMsg(gainNeeded);
            } else {
                adviceElement.style.color = "#2e7d32";
                adviceElement.innerText = langData.perfectMsg;
            }

            document.getElementById('resultsBlock').style.display = 'block';
        }
    </script>
</body>
</html>
